version: '3.8'

services:
  attackgraph-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attackgraph_ai_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=50m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - devsecops_net

networks:
  devsecops_net:
    driver: bridge
